<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Play feature graphic, 1024x500. Drawn on a square canvas because the
       rasteriser (qlmanage) only cuts squares; the art sits in the middle
       500 rows (y 262-762) and the PNG is centre-cropped to them:
       (the two commands are in store/listing.md, under Artwork).
       Source of truth for the mark is web/public/favicon.svg. -->
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="t" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#050905"/>
  <g transform="translate(0 262)">
  <g transform="translate(70 90) scale(5)">
    <g stroke="#00ff66" stroke-width="2.5" filter="url(#g)">
      <line x1="25" y1="10" x2="25" y2="54"/>
      <line x1="41" y1="10" x2="41" y2="54"/>
      <line x1="9" y1="25" x2="55" y2="25"/>
      <line x1="9" y1="41" x2="55" y2="41"/>
    </g>
    <g filter="url(#g)">
      <path d="M12 12 L21 21 M21 12 L12 21" stroke="#00ff66" stroke-width="3" stroke-linecap="round"/>
      <circle cx="33" cy="33" r="5" fill="none" stroke="#00d2ff" stroke-width="3"/>
    </g>
    <rect x="45" y="46" width="7" height="3.5" fill="#00ff66"/>
  </g>
  <g font-family="Menlo, Monaco, monospace">
    <text x="430" y="222" font-size="62" font-weight="bold" fill="#00ff66" filter="url(#t)">tici-taca-toey_</text>
    <text x="432" y="286" font-size="25" fill="#b7f7c6">&gt; tic-tac-toe, any size, online</text>
    <text x="432" y="330" font-size="21" fill="#62895f">boards to 12x12 · up to 10 players</text>
    <text x="432" y="362" font-size="21" fill="#62895f">robots standing by</text>
  </g>
  </g>
</svg>
